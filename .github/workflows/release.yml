name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS artifacts
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install coreutils
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build release artifacts
        run: make release-macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    container:
      image: rust:1.93.1

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            make \
            gcc-x86-64-linux-gnu \
            g++-x86-64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build release artifacts
        run: make release-linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Update Homebrew formula
        run: bash ./update_homebrew_formula.sh

      - name: Create PR for Formula updates
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          commit-message: "chore(formula): update Homebrew formula for ${{ github.ref_name }}"
          branch: "automation/formula-${{ github.ref_name }}"
          title: "chore(formula): update Homebrew formula for ${{ github.ref_name }}"
          body: |
            Automated update of Homebrew formula files for release `${{ github.ref_name }}`.
            
            Generated from artifacts in `dist/`.
          add-paths: |
            Formula/**

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true