[package]
name = "move-cli"
version = "0.1.0"
authors = ["Diem Association <opensource@diem.com>"]
description = "CLI frontend for the Move compiler and VM"
repository = "https://github.com/diem/diem"
homepage = "https://diem.com"
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
anyhow.workspace = true
clap.workspace = true
move-bytecode-source-map.workspace = true
move-disassembler.workspace = true
move-docgen.workspace = true
move-command-line-common.workspace = true
move-coverage.workspace = true
move-core-types.workspace = true
move-compiler.workspace = true
move-stdlib-natives.workspace = true
move-vm-runtime.workspace = true
move-vm-test-utils.workspace = true
move-binary-format.workspace = true
move-package.workspace = true
move-unit-test.workspace = true
move-bytecode-viewer.workspace = true
move-abstract-interpreter.workspace = true
move-bytecode-to-wasm.workspace = true
move-packages-build.workspace = true
move-evm-abi-generator.workspace = true
move-test-runner.workspace = true
wasm-opt = "0.116.1"
wasmprinter.workspace = true
thiserror.workspace = true
alloy = { version = "1.0", features = ["essentials", "signer-keystore", "getrandom", "provider-trace-api", "provider-debug-api"] }
eyre = "0.6.12"
bytesize = "2.3.1"
brotli2 = "0.3.2"
tiny-keccak = "2.0.2"
toml = "1.0.3"
wasm-encoder = "0.245.1"
wasm-parser = "0.2.2"
glob = "0.3.3"
rustc-host = "0.1.7"
hex = "0.4.3"
wasmparser = "0.245.1"
wasmer = "7.0.1"
tempfile = "3.25.0"
wasm-gen = "0.1.4"
tokio = "1"

[[bin]]
name = "move-stylus"
path = "src/main.rs"
